name: Deploy DevConnect to Azure VM

on:
  push:
    branches: [deploybranch]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add all your service directories here
        service: ['auth-service', 'company-service', 'user-service', 'application-service']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and run tests for ${{ matrix.service }}
        run: |
          echo "--- Testing ${{ matrix.service }} ---"
          cd services/${{ matrix.service }}
          npm install
          npm test --if-present # Use --if-present so it doesn't fail on services without tests yet
  
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE }}
          script: |
            set -e
            
            echo "Creating project directory if it doesn't exist..."
            mkdir -p ~/devconnect
            cd ~/devconnect
            
            echo "Cloning or updating repositories..."
            if [ ! -d "DevConnect-Backend" ]; then
              git clone https://github.com/Legend-2727/DevConnect-Backend.git
              cd DevConnect-Backend
              git fetch origin
              git checkout deploybranch
              cd ..
            else
              cd DevConnect-Backend
              git fetch origin
              git checkout deploybranch
              git pull origin deploybranch
              cd ..
            fi
            
            if [ ! -d "devconnect-frontend" ]; then
              git clone https://github.com/OitijhyaHoque/devconnect-frontend.git
              cd devconnect-frontend
              git checkout deploybranch
              cd ..
            else
              cd devconnect-frontend
              git fetch origin
              git checkout deploybranch
              git pull origin deploybranch
              cd ..
            fi
            
            echo "Setting up environment variables..."

            # Backend .env files
            cat > DevConnect-Backend/services/ai-service/.env << EOL
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_HOST=db
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_PASS=${{ secrets.GMAIL_PASS }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            ALLOW_REQUEST_FROM=${{ secrets.ALLOW_REQUEST_FROM }}
            PORT=${{ secrets.AI_SERVICE_PORT }}
            CORSFIX=${{ secrets.VM_HOST }}
            HTTPPUBLICIP=http://${{ secrets.VM_HOST }}

            cat > DevConnect-Backend/services/application-service/.env << EOL
            PORT=${{ secrets.APPLICATION_SERVICE_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_HOST=db
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@db:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FRONTEND=http://${{ secrets.VM_HOST }}:${{ secrets.FRONTEND_PORT }}
            CORSFIX=${{ secrets.VM_HOST }}
            HTTPPUBLICIP=http://${{ secrets.VM_HOST }}
            EOL
            
            cat > DevConnect-Backend/services/auth-service/.env << EOL
            PORT=${{ secrets.AUTH_SERVICE_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_HOST=db
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@db:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORSFIX=${{ secrets.VM_HOST }}
            HTTPPUBLICIP=http://${{ secrets.VM_HOST }}
            EOL

            cat > DevConnect-Backend/services/user-service/.env << EOL
            PORT=${{ secrets.USER_SERVICE_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_HOST=db
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@db:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORSFIX=${{ secrets.VM_HOST }}
            HTTPPUBLICIP=http://${{ secrets.VM_HOST }}
            EOL
            
            cat > DevConnect-Backend/services/company-service/.env << EOL
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            DATABASE_URL=postgresql://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@db:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}
            AI_SERVICE_URL=http://ai-service:8000
            UPLOAD_BASE_PATH=./uploads
            DB_HOST=db
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASS }}
            DB_NAME=${{ secrets.DB_NAME }}
            PORT=${{ secrets.COMPANY_SERVICE_PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CORSFIX=${{ secrets.VM_HOST }}
            HTTPPUBLICIP=http://${{ secrets.VM_HOST }}
            EOL
            
            # Frontend .env
            cat > devconnect-frontend/.env << EOL
            NEXT_PUBLIC_USER_API_URL=http://${{ secrets.VM_HOST }}:${{ secrets.USER_SERVICE_PORT }}
            NEXT_PUBLIC_AUTH_API_URL=http://${{ secrets.VM_HOST }}:${{ secrets.AUTH_SERVICE_PORT }}
            NEXT_PUBLIC_APPLICATION_API_URL=http://${{ secrets.VM_HOST }}:${{ secrets.APPLICATION_SERVICE_PORT }}
            NEXT_PUBLIC_COMPANY_API_URL=http://${{ secrets.VM_HOST }}:${{ secrets.COMPANY_SERVICE_PORT }}
            NEXT_PUBLIC_AI_API_URL=http://${{ secrets.VM_HOST }}:${{ secrets.AI_SERVICE_PORT }}
            NEXT_PUBLIC_THIS=http://${{ secrets.VM_HOST }}:${{ secrets.FRONTEND_PORT }}
            NEXTAUTH_URL=http://frontend:3000
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            EOL

            echo "Rebuilding and restarting Docker containers..."
            cd DevConnect-Backend
            sudo docker compose down
            sudo docker compose up --build -d
            
            echo "Deployment completed successfully!"
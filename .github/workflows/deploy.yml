name: Deploy DevConnect to Azure VM

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add all your service directories here
        service: ['auth-service', 'company-service', 'user-service', 'application-service']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and run tests for ${{ matrix.service }}
        run: |
          echo "--- Testing ${{ matrix.service }} ---"
          cd services/${{ matrix.service }}
          npm install
          npm test --if-present # Use --if-present so it doesn't fail on services without tests yet
  
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE }}
          script: |
            set -e
            
            echo "Creating project directory if it doesn't exist..."
            mkdir -p ~/devconnect-2
            cd ~/devconnect-2
            
            echo "Cloning or updating repositories..."
            if [ ! -d "DevConnect-Backend" ]; then
              git clone https://github.com/Legend-2727/DevConnect-Backend.git
              cd DevConnect-Backend
              git checkout deploy
              cd ..
            else
              cd DevConnect-Backend
              git checkout deploy
              git pull origin deploy
              cd ..
            fi
            
            echo "Setting up environment variables..."

            cat > DevConnect-Backend/services/application-service/.env << EOL
            PORT=4006
            DB_USER=root
            DB_PASS=password
            DB_HOST=db
            DB_PORT=5432
            DB_NAME=main
            DATABASE_URL=postgresql://root:password@db:5432/main
            JWT_SECRET=supersecret
            FRONTEND='http://localhost:3000'
            CORSFIX=98.70.42.26
            HTTPPUBLICIP=http://98.70.42.26
            EOL
            
            cat > DevConnect-Backend/services/auth-service/.env << EOL
            PORT=4000
            DB_USER=root
            DB_PASS=password
            DB_HOST=db
            DB_PORT=5432
            DB_NAME=main
            DATABASE_URL=postgresql://root:password@db:5432/main
            JWT_SECRET=supersecret
            CORSFIX=98.70.42.26
            HTTPPUBLICIP=http://98.70.42.26
            EOL

            cat > DevConnect-Backend/services/user-service/.env << EOL
            PORT=4004
            DB_USER=root
            DB_PASS=password
            DB_HOST=db
            DB_PORT=5432
            DB_NAME=main
            DATABASE_URL=postgresql://root:password@db:5432/main
            JWT_SECRET=supersecret
            CORSFIX=98.70.42.26
            HTTPPUBLICIP=http://98.70.42.26
            EOL
            
            cat > DevConnect-Backend/services/company-service/.env << EOL
            SMTP_HOST=smtp.example.com
            SMTP_PORT=587
            SMTP_USER=apikey_or_username
            SMTP_PASS=secret
            SMTP_FROM=no-reply@devconnect.ai
            DATABASE_URL=postgresql://root:password@db:5432/main
            AI_SERVICE_URL=http://ai-service:8000
            UPLOAD_BASE_PATH=./uploads
            DB_HOST=db
            DB_PORT=5432
            DB_USER=root
            DB_PASSWORD=password
            DB_NAME=main
            PORT=4005
            JWT_SECRET=supersecret
            CORSFIX=98.70.42.26
            HTTPPUBLICIP=http://98.70.42.26
            EOL
            

            if [ ! -d "devconnect-frontend" ]; then
              git clone https://github.com/OitijhyaHoque/devconnect-frontend.git
              cd devconnect-frontend
              git checkout deploy
              cd ..
            else
              cd devconnect-frontend
              git checkout deploy
              git pull origin deploy
              cd ..
            fi
            
            echo "Setting up environment variables..."
            
            # Frontend .env
            cat > devconnect-frontend/.env << EOL
            NEXT_PUBLIC_USER_API_URL=http://98.70.42.26:4004
            NEXT_PUBLIC_AUTH_API_URL=http://98.70.42.26:4000
            NEXT_PUBLIC_APPLICATION_API_URL=http://98.70.42.26:4006
            NEXT_PUBLIC_COMPANY_API_URL=http://98.70.42.26:4005
            NEXT_PUBLIC_AI_API_URL=http://98.70.42.26:4002
            NEXT_PUBLIC_THIS=http://98.70.42.26:3000
            NEXTAUTH_URL=http://frontend:3000
            NEXTAUTH_SECRET=JdMDQ/xWWWb7NAgwm5DUHv5MNSrbaWf0G4fuJQR4zrw=
            EOL

            # sudo mkdir -p devconnect-frontend/.next
            # sudo touch devconnect-frontend/.next/.env
            # sudo cat > devconnect-frontend/.next/.env << EOL
            # NEXT_PUBLIC_API_BASE_URL={{ secrets.NEXT_PUBLIC_API_BASE_URL }}
            # NEXT_PUBLIC_APP_BASE_URL={{ secrets.NEXT_PUBLIC_APP_BASE_URL }}
            # EOL


            echo "Rebuilding and restarting Docker containers..."
            cd DevConnect-Backend
            sudo docker compose down
            sudo docker compose up --build -d
            
            echo "Deployment completed successfully!"
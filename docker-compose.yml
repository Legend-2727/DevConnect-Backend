# version: '3.8'

services:
  auth-service:
    container_name: auth-service
    build: ./services/auth-service
    ports:
      - "4000:4000"
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    command: npm run dev
    env_file:
      - ./services/auth-service/.env
    depends_on:
      - db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 5s
      timeout: 30s
      retries: 3

  application-service:
    container_name: application-service
    build: ./services/application-service
    ports:
      - "4003:4003"
    volumes:
      - ./services/application-service:/app
      - /app/node_modules
    command: npm run dev
    env_file:
      - ./services/application-service/.env
    depends_on:
      - db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 5s
      timeout: 30s
      retries: 3

  
  user-service:
    container_name: user-service
    build: ./services/user-service
    ports:
      - "4004:4004"
    volumes:
      - ./services/user-service:/app
      - ./uploads:/app/uploads 
      # - /app/node_modules
    command: npm run dev
    env_file:
      - ./services/user-service/.env
    depends_on:
      - db
      - ai-service
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4004/health"]
      interval: 5s
      timeout: 30s
      retries: 3

  frontend:
    container_name: frontend
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    build:
      context: ../devconnect-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../devconnect-frontend:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
    env_file:
      - ../devconnect-frontend/.env
    networks:
      - app_network

  company-service:
    build: ./services/company-service
    ports:
      - "4002:4002"
    volumes:
      - ./services/company-service:/app
      - ./uploads:/app/uploads
    command: npm run dev
    env_file:
      - ./services/company-service/.env
    depends_on:
      - db
      - ai-service
    networks:
      - app_network

  ai-service:
    build: ./services/ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./services/ai-service:/app
      - ./uploads:/app/uploads
    command: uvicorn app:app --host 0.0.0.0 --port 8000  # 🔥 Replace sleep
    env_file:
      - ./services/ai-service/.env
    depends_on:
      - db
    networks:
      - app_network

  db:
    container_name: db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:

# version: '3.8'

services:
  auth-service:
    container_name: auth-service
    build: ./services/auth-service
    ports:
      - "4000:4000"
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    command: npm run dev
    env_file:
      - ./services/auth-service/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 5s
      timeout: 30s
      retries: 3

  application-service:
    container_name: application-service
    build: ./services/application-service
    ports:
      - "4006:4006"
    volumes:
      - ./services/application-service:/app
      - /app/node_modules
      - ./uploads:/app/uploads  # Persistent volume for uploaded files
    command: npm run dev
    env_file:
      - ./services/application-service/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/health"]
      interval: 5s
      timeout: 30s
      retries: 3

  user-service:
    container_name: user-service
    build: ./services/user-service
    ports:
      - "4004:4004"
    volumes:
      - ./services/user-service:/app
      - /app/node_modules
      - ./uploads:/app/uploads  # Persistent volume for uploaded files
    command: npm run dev
    env_file:
      - ./services/user-service/.env
    depends_on:
      - db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4004/health"]
      interval: 5s
      timeout: 30s
      retries: 3

  company-service:
    container_name: company-service
    build: ./services/company-service
    ports:
      - "4005:4005"
    volumes:
      - ./services/company-service:/app
      - /app/node_modules
      - ./uploads:/app/uploads  # Persistent volume for uploaded files
    command: npm run dev
    env_file:
      - ./services/company-service/.env
    depends_on:
      - db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4005/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  ai-service:
    container_name: ai-service
    build: ./services/ai-service
    ports:
      - "4002:8000"
    volumes:
      - ./uploads:/app/uploads  # Persistent volume for uploaded files
      - ./services/ai-service/sample-cvs:/app/sample-cvs  # CV samples
    command: python app.py
    env_file:
      - ./services/ai-service/.env
    depends_on:
      - db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    container_name: frontend
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    build:
      context: ../devconnect-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../devconnect-frontend:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    env_file:
      - ../devconnect-frontend/.env
    networks:
      - app_network

  db:
    container_name: db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d main"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:

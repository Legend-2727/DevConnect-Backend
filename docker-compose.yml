# version: '3.8'

services:
  auth-service:
    build: ./services/auth-service
    ports:
      - "4000:4000"
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    command: npm run dev
    env_file:
      - ./services/auth-service/.env
    depends_on:
      - db

  application-service:
    build: ./services/application-service
    ports:
      - "4003:4003"
    volumes:
      - ./services/application-service:/app
      - /app/node_modules
    command: npm run dev
    env_file:
      - ./services/application-service/.env
    depends_on:
      - db

  
  user-service:
    build: ./services/user-service
    ports:
      - "4004:4004"
    volumes:
      - ./services/user-service:/app
      - ./uploads:/app/uploads 
      # - /app/node_modules
    command: npm run dev
    env_file:
      - ./services/user-service/.env
    depends_on:
      - db
      - ai-service  # 🔥 ADD this to wait for ai-service

  company-service:
    build: ./services/company-service          # ← Dockerfile lives here
    ports:
      - "4002:4002"                            # expose externally on :4002
    volumes:
      - ./services/company-service:/app        # live-reload during dev
      # - /app/node_modules                      # keep host node_modules out
      - ./uploads:/app/uploads                 # share CV files if needed
    command: npm run dev                       # or `npm start` for prod
    env_file:
      - ./services/company-service/.env        # DB + SMTP creds
    depends_on:
      - db
      - ai-service                             # needs /shortlist endpoint


  ai-service:
    build: ./services/ai-service
    ports:
      - "8000:8000"  # 🔥 Expose FastAPI port
    volumes:
      - ./services/ai-service:/app
      - ./uploads:/app/uploads
    command: uvicorn app:app --host 0.0.0.0 --port 8000  # 🔥 Replace sleep
    env_file:
      - ./services/ai-service/.env
    depends_on:
      - db



  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
